<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P同期メトロノーム</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel hero">
        <p class="eyebrow">P2P Sync Metronome</p>
        <h1>P2P同期メトロノーム</h1>
        <p class="description">
          複数の端末でタイミングを同期しながら、同じテンポのメトロノームを再生できます。
        </p>
        <a id="startHostLink" class="start-link" href="/host/">ホストとして開始</a>
      </section>

      <section class="panel participant-guide">
        <h2>参加する方へ</h2>
        <p>
          ホストから共有された参加者URLを開くか、QRコードを読み取って参加してください。
        </p>
      </section>
    </main>

    <script>
      const startHostLink = document.querySelector("#startHostLink");

      startHostLink.addEventListener("click", (event) => {
        if (event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
          return;
        }

        try {
          sessionStorage.setItem("p2p-metronome:auto-create-room", "1");
        } catch {
          // The host page remains usable with its manual room creation button.
        }
      });
    </script>
  </body>
</html>
