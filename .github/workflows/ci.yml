name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Vite and Wrangler run on Node.js; Wrangler requires Node.js 22 or later.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build frontend
        run: bun run build:frontend

      - name: Build Worker (dry run, no deploy)
        run: bun run --cwd server wrangler deploy --dry-run --outdir "$RUNNER_TEMP/wrangler-dry-run" --config wrangler.jsonc
        env:
          WRANGLER_SEND_METRICS: "false"
